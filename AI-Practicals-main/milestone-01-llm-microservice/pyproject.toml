[project]
name = "milestone-01-llm-microservice"
version = "1.0.0"
description = "FastAPI microservice using Amazon Bedrock and Amazon Nova Lite"
authors = [
    { name = "Vyom" }
]
requires-python = ">=3.10"

dependencies = [
    "fastapi",
    "uvicorn",
    "boto3",
    "python-dotenv",
    "pydantic",
    "pytest",
    "httpx"
]

[tool.pytest.ini_options]
python_files = [
    "test_*.py"
]